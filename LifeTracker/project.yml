name: LifeTracker
options:
  bundleIdPrefix: com.dushyantsingh
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settingGroups:
  common:
    base:
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "26.0"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      PRODUCT_BUNDLE_IDENTIFIER: com.dushyantsingh.lifetracker
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      ENABLE_PREVIEWS: true
      SWIFT_STRICT_CONCURRENCY: minimal
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  LifeTracker:
    type: application
    platform: iOS
    settings:
      groups: [common]
    sources:
      - path: LifeTracker
    info:
      path: Generated/LifeTracker-Info.plist
      properties:
        CFBundleDisplayName: Life Tracker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "Life Tracker reads your health data (steps, workouts, sleep, heart rate, and anything Whoop or other apps write into Health) so it can show it alongside your goals and daily log, entirely on this device."
        NSHealthUpdateUsageDescription: "Life Tracker does not currently write data back to Health. This permission is requested by the framework but unused."
        NSCalendarsFullAccessUsageDescription: "Life Tracker reads your calendar so today's and this week's events can show up on your Today and Insights screens, and so goals can optionally create an event on their target date."
        NSFaceIDUsageDescription: "Face ID is used to lock Life Tracker so only you can open it."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - lifetracker
            CFBundleURLName: com.dushyantsingh.lifetracker.kite-oauth
    entitlements:
      path: Generated/LifeTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    postCompileScripts: []

  LifeTrackerTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      groups: [common]
    sources:
      - path: LifeTrackerTests
    dependencies:
      - target: LifeTracker

schemes:
  LifeTracker:
    build:
      targets:
        LifeTracker: all
        LifeTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LifeTrackerTests
    archive:
      config: Release
